services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    platform: linux/arm64
    volumes:
      - ./models:/models
    command: >
      -m /models/${MODEL_FILE:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${CTX_SIZE:-8192}
      --parallel ${PARALLEL:-2}
      --cache-type-k ${CACHE_TYPE_K:-q8_0}
      --cache-type-v ${CACHE_TYPE_V:-q8_0}
      --no-mmap
      --metrics
#      --verbose
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000
    ports:
      - "4000:4000"
    depends_on:
      llama-server:
        condition: service_healthy
