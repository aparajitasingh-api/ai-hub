# ollama-server deployment template
# ---------------------------------------------------------------------------
# All values wrapped in ${...} are substituted from:
#   k8s/<env>/ollama-server/vars.yml
#
# The template is reusable across environments AND across different models
# within the same environment.  For example, staging might run a single 3b
# workload while production runs both 3b and 14b as separate StatefulSets.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${PVC_NAME}
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ${PVC_ACCESS_MODE}
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: ${PVC_STORAGE_SIZE}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP_NAME}-config
  namespace: ${NAMESPACE}
data:
  MODEL_FILE: "${MODEL_FILE}"
  HF_MODEL_REPO: "${HF_MODEL_REPO}"
  CTX_SIZE: "${CTX_SIZE}"
  PARALLEL: "${PARALLEL}"
  CACHE_TYPE_K: "${CACHE_TYPE_K}"
  CACHE_TYPE_V: "${CACHE_TYPE_V}"
  PORT: "${OLLAMA_PORT}"

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
spec:
  serviceName: ${APP_NAME}
  replicas: ${REPLICAS}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${APP_NAME}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        model: ${MODEL_LABEL}
    spec:
      initContainers:
        - name: model-downloader
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              MODEL_PATH="/models/${MODEL_FILE}"
              if [ -f "${MODEL_PATH}" ]; then
                echo "Model already exists at ${MODEL_PATH}, skipping download."
                exit 0
              fi
              echo "Downloading ${MODEL_FILE} from ${HF_MODEL_REPO}..."
              pip install --quiet huggingface_hub
              huggingface-cli download "${HF_MODEL_REPO}" "${MODEL_FILE}" \
                --local-dir /models \
                --local-dir-use-symlinks False
              echo "Download complete."
          env:
            - name: MODEL_FILE
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: MODEL_FILE
            - name: HF_MODEL_REPO
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: HF_MODEL_REPO
          volumeMounts:
            - name: models-storage
              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      containers:
        - name: llama-server
          image: ${LLAMA_SERVER_IMAGE}
          env:
            - name: MODEL_FILE
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: MODEL_FILE
            - name: LLAMA_ARG_MODEL
              value: "/models/$(MODEL_FILE)"
            - name: LLAMA_ARG_CTX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: CTX_SIZE
            - name: LLAMA_ARG_N_PARALLEL
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: PARALLEL
            - name: LLAMA_ARG_CACHE_TYPE_K
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: CACHE_TYPE_K
            - name: LLAMA_ARG_CACHE_TYPE_V
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: CACHE_TYPE_V
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              valueFrom:
                configMapKeyRef:
                  name: ${APP_NAME}-config
                  key: PORT
            - name: LLAMA_ARG_NO_MMAP
              value: "1"
            - name: LLAMA_ARG_ENDPOINT_METRICS
              value: "1"
          ports:
            - containerPort: ${OLLAMA_PORT}
              name: http
          volumeMounts:
            - name: models-storage
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: ${OLLAMA_PORT}
            initialDelaySeconds: ${READINESS_INITIAL_DELAY}
            periodSeconds: ${READINESS_PERIOD}
            failureThreshold: ${READINESS_FAILURE_THRESHOLD}
          livenessProbe:
            httpGet:
              path: /health
              port: ${OLLAMA_PORT}
            initialDelaySeconds: ${LIVENESS_INITIAL_DELAY}
            periodSeconds: ${LIVENESS_PERIOD}
            failureThreshold: ${LIVENESS_FAILURE_THRESHOLD}
          resources:
            requests:
              cpu: "${RESOURCES_CPU_REQUEST}"
              memory: ${RESOURCES_MEMORY_REQUEST}
            limits:
              cpu: "${RESOURCES_CPU_LIMIT}"
              memory: ${RESOURCES_MEMORY_LIMIT}

      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: ${PVC_NAME}

---

apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
spec:
  selector:
    app: ${APP_NAME}
  ports:
    - name: http
      port: ${OLLAMA_PORT}
      targetPort: ${OLLAMA_PORT}
  type: ClusterIP
