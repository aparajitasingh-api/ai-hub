# Production environment - ollama-server (3b model)
# Used with: k8s/ollama-server-deployment.yml
#
# Lightweight model for fast, low-latency tasks (autocomplete, simple prompts).

# -- Identity --
APP_NAME: ollama-server-3b
MODEL_LABEL: 3b
NAMESPACE: llm-server

# -- Image --
LLAMA_SERVER_IMAGE: ghcr.io/ggml-org/llama.cpp:server

# -- Model --
MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
HF_MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF

# -- Server tuning --
CTX_SIZE: "4096"
PARALLEL: "8"
CACHE_TYPE_K: q8_0
CACHE_TYPE_V: q8_0
OLLAMA_PORT: 8080

# -- Scaling --
REPLICAS: 2

# -- Resources --
RESOURCES_CPU_REQUEST: "1"
RESOURCES_MEMORY_REQUEST: 4Gi
RESOURCES_CPU_LIMIT: "4"
RESOURCES_MEMORY_LIMIT: 8Gi

# -- Storage --
PVC_NAME: ollama-models-pvc
PVC_ACCESS_MODE: ReadWriteMany
STORAGE_CLASS: efs-sc
PVC_STORAGE_SIZE: 50Gi

# -- Health checks --
READINESS_INITIAL_DELAY: 20
READINESS_PERIOD: 10
READINESS_FAILURE_THRESHOLD: 6
LIVENESS_INITIAL_DELAY: 30
LIVENESS_PERIOD: 30
LIVENESS_FAILURE_THRESHOLD: 3
