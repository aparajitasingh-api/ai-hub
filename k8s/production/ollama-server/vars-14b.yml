# Production environment - ollama-server (14b model)
# Used with: k8s/ollama-server-deployment.yml
#
# Full-size model for complex tasks (code generation, RCA, analysis).

# -- Identity --
APP_NAME: ollama-server-14b
MODEL_LABEL: 14b
NAMESPACE: llm-server

# -- Image --
LLAMA_SERVER_IMAGE: ghcr.io/ggml-org/llama.cpp:server

# -- Model --
MODEL_FILE: qwen2.5-coder-14b-instruct-q4_k_m.gguf
HF_MODEL_REPO: Qwen/Qwen2.5-Coder-14B-Instruct-GGUF

# -- Server tuning --
CTX_SIZE: "4096"
PARALLEL: "4"
CACHE_TYPE_K: q8_0
CACHE_TYPE_V: q8_0
OLLAMA_PORT: 8080

# -- Scaling --
REPLICAS: 3

# -- Resources --
RESOURCES_CPU_REQUEST: "2"
RESOURCES_MEMORY_REQUEST: 8Gi
RESOURCES_CPU_LIMIT: "8"
RESOURCES_MEMORY_LIMIT: 24Gi

# -- Storage --
PVC_NAME: ollama-models-pvc
PVC_ACCESS_MODE: ReadWriteMany
STORAGE_CLASS: efs-sc
PVC_STORAGE_SIZE: 50Gi

# -- Health checks --
READINESS_INITIAL_DELAY: 30
READINESS_PERIOD: 10
READINESS_FAILURE_THRESHOLD: 12
LIVENESS_INITIAL_DELAY: 60
LIVENESS_PERIOD: 30
LIVENESS_FAILURE_THRESHOLD: 3
