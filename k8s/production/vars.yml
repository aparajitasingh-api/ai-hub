# =============================================================================
# Production environment - consolidated vars
# =============================================================================
# Single vars file for all components deployed in production.
# Variable names are prefixed by component to avoid collisions.
#
# Components:
#   - ollama-server  (one section per model size: OLLAMA_3B_*, OLLAMA_14B_*)
#   - litellm        (LITELLM_*)
#
# Shared variables that apply to all components use the SHARED_ prefix.
# =============================================================================

# -- Shared --
SHARED_NAMESPACE: llm-server

# =============================================================================
# ollama-server (3b) - lightweight model
# =============================================================================

OLLAMA_3B_APP_NAME: ollama-server-3b
OLLAMA_3B_MODEL_LABEL: 3b
OLLAMA_3B_IMAGE: ghcr.io/ggml-org/llama.cpp:server

# Model
OLLAMA_3B_MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
OLLAMA_3B_HF_MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF

# Server tuning
OLLAMA_3B_CTX_SIZE: "4096"
OLLAMA_3B_PARALLEL: "8"
OLLAMA_3B_CACHE_TYPE_K: q8_0
OLLAMA_3B_CACHE_TYPE_V: q8_0
OLLAMA_3B_PORT: 8080

# Scaling
OLLAMA_3B_REPLICAS: 2

# Resources
OLLAMA_3B_CPU_REQUEST: "1"
OLLAMA_3B_MEMORY_REQUEST: 4Gi
OLLAMA_3B_CPU_LIMIT: "4"
OLLAMA_3B_MEMORY_LIMIT: 8Gi

# Storage
OLLAMA_3B_PVC_NAME: ollama-models-pvc
OLLAMA_3B_PVC_ACCESS_MODE: ReadWriteMany
OLLAMA_3B_STORAGE_CLASS: efs-sc
OLLAMA_3B_PVC_STORAGE_SIZE: 50Gi

# Health checks
OLLAMA_3B_READINESS_INITIAL_DELAY: 20
OLLAMA_3B_READINESS_PERIOD: 10
OLLAMA_3B_READINESS_FAILURE_THRESHOLD: 6
OLLAMA_3B_LIVENESS_INITIAL_DELAY: 30
OLLAMA_3B_LIVENESS_PERIOD: 30
OLLAMA_3B_LIVENESS_FAILURE_THRESHOLD: 3

# =============================================================================
# ollama-server (14b) - full-size model
# =============================================================================

OLLAMA_14B_APP_NAME: ollama-server-14b
OLLAMA_14B_MODEL_LABEL: 14b
OLLAMA_14B_IMAGE: ghcr.io/ggml-org/llama.cpp:server

# Model
OLLAMA_14B_MODEL_FILE: qwen2.5-coder-14b-instruct-q4_k_m.gguf
OLLAMA_14B_HF_MODEL_REPO: Qwen/Qwen2.5-Coder-14B-Instruct-GGUF

# Server tuning
OLLAMA_14B_CTX_SIZE: "4096"
OLLAMA_14B_PARALLEL: "4"
OLLAMA_14B_CACHE_TYPE_K: q8_0
OLLAMA_14B_CACHE_TYPE_V: q8_0
OLLAMA_14B_PORT: 8080

# Scaling
OLLAMA_14B_REPLICAS: 3

# Resources
OLLAMA_14B_CPU_REQUEST: "2"
OLLAMA_14B_MEMORY_REQUEST: 8Gi
OLLAMA_14B_CPU_LIMIT: "8"
OLLAMA_14B_MEMORY_LIMIT: 24Gi

# Storage
OLLAMA_14B_PVC_NAME: ollama-models-pvc
OLLAMA_14B_PVC_ACCESS_MODE: ReadWriteMany
OLLAMA_14B_STORAGE_CLASS: efs-sc
OLLAMA_14B_PVC_STORAGE_SIZE: 50Gi

# Health checks
OLLAMA_14B_READINESS_INITIAL_DELAY: 30
OLLAMA_14B_READINESS_PERIOD: 10
OLLAMA_14B_READINESS_FAILURE_THRESHOLD: 12
OLLAMA_14B_LIVENESS_INITIAL_DELAY: 60
OLLAMA_14B_LIVENESS_PERIOD: 30
OLLAMA_14B_LIVENESS_FAILURE_THRESHOLD: 3

# =============================================================================
# litellm - OpenAI-compatible proxy
# =============================================================================

LITELLM_IMAGE: ghcr.io/berriai/litellm:main-latest
LITELLM_PORT: 4000
LITELLM_REPLICAS: 3

# Resources
LITELLM_CPU_REQUEST: 250m
LITELLM_MEMORY_REQUEST: 512Mi
LITELLM_CPU_LIMIT: "1"
LITELLM_MEMORY_LIMIT: 1Gi

# Health checks
LITELLM_READINESS_INITIAL_DELAY: 10
LITELLM_READINESS_PERIOD: 5

# Upstream model routing
# Production exposes both model sizes.  Callers pick by model_name:
#   - qwen-14b  -> heavy tasks (code gen, RCA, analysis)
#   - qwen-3b   -> light tasks (autocomplete, simple prompts)
#   - qwen-local -> alias for the default (14b)
LITELLM_CONFIG: |
    model_list:
      - model_name: qwen-14b
        litellm_params:
          model: openai/qwen-14b
          api_base: http://ollama-server-14b:8080/v1
          api_key: none
      - model_name: qwen-3b
        litellm_params:
          model: openai/qwen-3b
          api_base: http://ollama-server-3b:8080/v1
          api_key: none
      - model_name: qwen-local
        litellm_params:
          model: openai/qwen-local
          api_base: http://ollama-server-14b:8080/v1
          api_key: none
