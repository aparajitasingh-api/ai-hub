# Production environment - litellm proxy
# Used with: k8s/litellm-deployment.yml
#
# Routes requests to both 3b and 14b ollama-server backends.
# Callers select the model by name in the API request.

# -- Identity --
NAMESPACE: llm-server

# -- Image --
LITELLM_IMAGE: ghcr.io/berriai/litellm:main-latest

# -- Server --
LITELLM_PORT: 4000

# -- Scaling --
REPLICAS: 3

# -- Resources --
RESOURCES_CPU_REQUEST: 250m
RESOURCES_MEMORY_REQUEST: 512Mi
RESOURCES_CPU_LIMIT: "1"
RESOURCES_MEMORY_LIMIT: 1Gi

# -- Health checks --
READINESS_INITIAL_DELAY: 10
READINESS_PERIOD: 5

# -- Upstream model routing --
# Production exposes both model sizes.  Callers pick by model_name:
#   - qwen-14b  → heavy tasks (code gen, RCA, analysis)
#   - qwen-3b   → light tasks (autocomplete, simple prompts)
#   - qwen-local → alias for the default (14b)
LITELLM_CONFIG: |
    model_list:
      - model_name: qwen-14b
        litellm_params:
          model: openai/qwen-14b
          api_base: http://ollama-server-14b:8080/v1
          api_key: none
      - model_name: qwen-3b
        litellm_params:
          model: openai/qwen-3b
          api_base: http://ollama-server-3b:8080/v1
          api_key: none
      - model_name: qwen-local
        litellm_params:
          model: openai/qwen-local
          api_base: http://ollama-server-14b:8080/v1
          api_key: none
