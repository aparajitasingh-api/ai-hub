# ollama-server 3b deployment
# ---------------------------------------------------------------------------
# All values wrapped in ${...} are substituted from k8s/<env>/vars.yml
# using the OLLAMA_3B_* and SHARED_* prefixes.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Namespace
metadata:
  name: ${SHARED_NAMESPACE}

---

#apiVersion: v1
#kind: PersistentVolumeClaim
#metadata:
#  name: ${OLLAMA_3B_PVC_NAME}
#  namespace: ${SHARED_NAMESPACE}
#spec:
#  accessModes:
#    - ${OLLAMA_3B_PVC_ACCESS_MODE}
#  storageClassName: ${OLLAMA_3B_STORAGE_CLASS}
#  resources:
#    requests:
#      storage: ${OLLAMA_3B_PVC_STORAGE_SIZE}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: ${OLLAMA_3B_APP_NAME}-config
  namespace: ${SHARED_NAMESPACE}
data:
  MODEL_FILE: "${OLLAMA_3B_MODEL_FILE}"
  HF_MODEL_REPO: "${OLLAMA_3B_HF_MODEL_REPO}"
  CTX_SIZE: "${OLLAMA_3B_CTX_SIZE}"
  PARALLEL: "${OLLAMA_3B_PARALLEL}"
  CACHE_TYPE_K: "${OLLAMA_3B_CACHE_TYPE_K}"
  CACHE_TYPE_V: "${OLLAMA_3B_CACHE_TYPE_V}"
  PORT: "${OLLAMA_3B_PORT}"

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${OLLAMA_3B_APP_NAME}
  namespace: ${SHARED_NAMESPACE}
spec:
  serviceName: ${OLLAMA_3B_APP_NAME}
  replicas: ${OLLAMA_3B_REPLICAS}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ${OLLAMA_3B_APP_NAME}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
        app: ${OLLAMA_3B_APP_NAME}
        model: ${OLLAMA_3B_MODEL_LABEL}
    spec:
      initContainers:
        - name: model-downloader
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              MODEL_PATH="/models/${MODEL_FILE}"
              if [ -f "${MODEL_PATH}" ]; then
                echo "Model already exists at ${MODEL_PATH}, skipping download."
                exit 0
              fi
              echo "Downloading ${MODEL_FILE} from ${HF_MODEL_REPO}..."
              pip install --quiet huggingface_hub
              huggingface-cli download "${HF_MODEL_REPO}" "${MODEL_FILE}" \
                --local-dir /models \
                --local-dir-use-symlinks False
              echo "Download complete."
          env:
            - name: MODEL_FILE
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: MODEL_FILE
            - name: HF_MODEL_REPO
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: HF_MODEL_REPO
#          volumeMounts:
#            - name: models-storage
#              mountPath: /models
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      containers:
        - name: llama-server
          image: ${OLLAMA_3B_IMAGE}
          env:
            - name: MODEL_FILE
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: MODEL_FILE
            - name: LLAMA_ARG_MODEL
              value: "/models/$(MODEL_FILE)"
            - name: LLAMA_ARG_CTX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: CTX_SIZE
            - name: LLAMA_ARG_N_PARALLEL
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: PARALLEL
            - name: LLAMA_ARG_CACHE_TYPE_K
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: CACHE_TYPE_K
            - name: LLAMA_ARG_CACHE_TYPE_V
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: CACHE_TYPE_V
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              valueFrom:
                configMapKeyRef:
                  name: ${OLLAMA_3B_APP_NAME}-config
                  key: PORT
            - name: LLAMA_ARG_NO_MMAP
              value: "1"
            - name: LLAMA_ARG_ENDPOINT_METRICS
              value: "1"
          ports:
            - containerPort: ${OLLAMA_3B_PORT}
              name: http
#          volumeMounts:
#            - name: models-storage
#              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: ${OLLAMA_3B_PORT}
            initialDelaySeconds: ${OLLAMA_3B_READINESS_INITIAL_DELAY}
            periodSeconds: ${OLLAMA_3B_READINESS_PERIOD}
            failureThreshold: ${OLLAMA_3B_READINESS_FAILURE_THRESHOLD}
          livenessProbe:
            httpGet:
              path: /health
              port: ${OLLAMA_3B_PORT}
            initialDelaySeconds: ${OLLAMA_3B_LIVENESS_INITIAL_DELAY}
            periodSeconds: ${OLLAMA_3B_LIVENESS_PERIOD}
            failureThreshold: ${OLLAMA_3B_LIVENESS_FAILURE_THRESHOLD}
          resources:
            requests:
              cpu: "${OLLAMA_3B_CPU_REQUEST}"
              memory: ${OLLAMA_3B_MEMORY_REQUEST}
            limits:
              cpu: "${OLLAMA_3B_CPU_LIMIT}"
              memory: ${OLLAMA_3B_MEMORY_LIMIT}

#      volumes:
#        - name: models-storage
#          persistentVolumeClaim:
#            claimName: ${OLLAMA_3B_PVC_NAME}

---

apiVersion: v1
kind: Service
metadata:
  name: ${OLLAMA_3B_APP_NAME}
  namespace: ${SHARED_NAMESPACE}
spec:
  selector:
    app: ${OLLAMA_3B_APP_NAME}
  ports:
    - name: http
      port: ${OLLAMA_3B_PORT}
      targetPort: ${OLLAMA_3B_PORT}
  type: ClusterIP
